*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.ov>*{pointer-events:auto}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.top{top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.title{min-width:0}
.live{display:inline-flex;align-items:center;gap:7px;font:600 11px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--hot)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 0 var(--hot);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.title h1{margin:2px 0 0;font:italic 800 26px/1 var(--f-disp);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.title p{margin:3px 0 0;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{text-align:right}
.clock small{display:block;font:600 10px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.clock b{white-space:nowrap;font:italic 700 22px/1.05 var(--f-disp);font-variant-numeric:tabular-nums}
.filters{top:84px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font:600 13px var(--f-body);color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{top:132px;left:auto;display:flex;flex-direction:column;gap:8px}
.tbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.tbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

#dock{position:absolute;left:0;right:0;bottom:0;border-radius:22px 22px 0 0;border-bottom:0;padding:14px 0 max(14px,env(safe-area-inset-bottom,0px));max-height:70%;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dhd{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px}
.dhd h2{margin:0;font:italic 700 15px var(--f-disp);letter-spacing:.14em;text-transform:uppercase}
.link{font:600 13px var(--f-body);color:var(--hot);padding:4px 0}
.cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding-bottom:2px}
.cards::-webkit-scrollbar{display:none}
.bl{flex:none;display:block}
.card{position:relative;flex:none;width:132px;scroll-snap-align:start;text-align:left;border-radius:16px;background:var(--soft);border:1px solid var(--line);padding:10px 12px 11px;display:flex;flex-direction:column;gap:1px}
.card .bl{position:absolute;top:10px;right:11px}
.pos{font:italic 800 34px/1 var(--f-disp);color:var(--c)}
.cn{font:600 14px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.cg{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.cs{font:italic 700 20px var(--f-disp);margin-top:5px;font-variant-numeric:tabular-nums}
.cs u{text-decoration:none;font-size:12px;color:var(--mute);margin-left:3px}
.list{overflow-y:auto;overscroll-behavior:contain}
.row{display:grid;grid-template-columns:34px 22px minmax(0,1fr) auto auto;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.row .p{font:italic 800 22px var(--f-disp);color:var(--c)}
.row .n{font:600 16px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.row .g{font-size:13px;color:var(--mute);text-align:right}
.row .s{font:italic 700 19px var(--f-disp);min-width:58px;text-align:right}
.row .s u{text-decoration:none;font-size:11px;color:var(--mute);margin-left:2px}

.dtl-h{display:flex;align-items:center;gap:10px}

.sub{font-size:13px;color:var(--mute);margin:4px 0 0}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 4px}
.speed b{font:italic 800 84px/.9 var(--f-disp);letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--c)}
.speed span{font:600 12px var(--f-body);letter-spacing:.16em;color:var(--mute);margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:8px 10px}
.stat label{display:block;font:600 10px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.stat b{font:italic 700 20px var(--f-disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat u{text-decoration:none;font-size:11px;color:var(--mute);margin-left:2px}

.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:10px 16px;font:600 14px var(--f-body);display:inline-block}
.btn.p{background:var(--hot);color:#fff;border-color:var(--hot)}
#msg{font-size:13px;margin-top:10px;color:var(--hot);min-height:18px}
.flab{display:block;margin:14px 0 6px;font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
input[type=url]{width:100%;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:13px ui-monospace,Menlo,monospace}

function drawBl(b,x,y,w){var q=bl(b),sc=w/24;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.fillStyle=q.f;ctx.fill(SHP);ctx.save();ctx.clip(SHP);ctx.fillStyle=q.t;ctx.fill(DIVP[q.d]);ctx.restore();ctx.lineWidth=2.2;ctx.strokeStyle=css['--sea2'];ctx.stroke(SHP);ctx.lineWidth=1.1;ctx.strokeStyle=css['--ink'];ctx.stroke(SHP);ctx.restore();}
function blSvg(b,w){var q=bl(b),id='bc'+(++bid);return '<svg class="bl" width="'+w+'" height="'+Math.round(w*28/24)+'" viewBox="0 0 24 28" aria-hidden="true"><defs><clipPath id="'+id+'"><path d="'+SHIELD+'"/></clipPath></defs><path d="'+SHIELD+'" fill="'+q.f+'"/><g clip-path="url(#'+id+')"><path d="'+DIV[q.d]+'" fill="'+q.t+'"/></g><path d="'+SHIELD+'" fill="none" stroke="var(--ink)" stroke-width="1.2"/></svg>';}
function pad(n){return (n<10?'0':'')+n;}
function vis(b){return filter==='ALL'||b.cls===filter;}

function inferClass(id) {
  var s = String(id).toUpperCase();
  if (s.startsWith('ULT')) return 'ULT';
  if (s.startsWith('OCF')) return 'OCF';
  if (s.startsWith('IMO')) return 'IMO';
  if (s.startsWith('C40')) return 'C40';
  return 'VIN';
}

function compute(){
  var list=[];
  var ids = Object.keys(hist.tracks || {});
  ids.forEach(function(id){
    var trackPts = hist.tracks[id] || [];
    if (!trackPts.length) return;
    var L = trackPts[trackPts.length - 1];
    var lat = L[1], lon = L[2], sog = L[3] || 0, cog = L[4] || 0;
    var ts = L[0] * 1000;
    var rankInfo = hist.ranks && hist.ranks[id];
    var dtl = 0;
    if (rankInfo && rankInfo.length) {
      dtl = rankInfo[rankInfo.length - 1][2] || 0;
    }
    var d24 = null;
    for (var i = trackPts.length - 1; i >= 0; i--){
      if (L[0] - trackPts[i][0] >= 23 * 3600) {
        d24 = hav(trackPts[i][1], trackPts[i][2], lat, lon);
        break;
      }
    }
    var simplifiedTrail = trackPts.map(function(pt){ return {lat: pt[1], lon: pt[2]}; });
    list.push({
      id: id,
      name: 'Boat ' + id,
      cls: inferClass(id),
      lat: lat,
      lon: lon,
      sog: sog,
      cog: cog,
      trail: simplifiedTrail,
      dtf: dtl,
      d24: d24,
      ts: ts
    });
  });

  var byc={};list.forEach(function(b){(byc[b.cls]=byc[b.cls]||[]).push(b);});
  Object.keys(byc).forEach(function(k){byc[k].sort(function(a,b){return a.id<b.id?-1:a.id>b.id?1:0;}).forEach(function(b,i){b.si=i;});});
  list.sort(function(a,b){return a.dtf-b.dtf;});
  var cc={};list.forEach(function(b,i){b.rank=i+1;cc[b.cls]=(cc[b.cls]||0)+1;b.crank=cc[b.cls];});
  boats=list;
  
  var el=document.getElementById('clock');
  if(hist.updated){
    el.textContent=new Date(hist.updated * 1000).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(',','');
  } else {
    el.textContent='--';
  }
}

function X(lon){return W/2+(lon-v.lon)*v.k;}
function Y(lat){return H/2-(my(lat)-v.my)*v.k;}
function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;draw();}
function poly(pts){ctx.beginPath();pts.forEach(function(p,i){var x=X(p[1]),y=Y(p[0]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});}
function label(txt,x,y,size,col,align){ctx.font='italic 700 '+size+'px "Barlow Condensed","Arial Narrow",sans-serif';ctx.textAlign=align||'left';ctx.lineWidth=4;ctx.strokeStyle=css['--sea2'];ctx.lineJoin='round';ctx.strokeText(txt,x,y);ctx.fillStyle=col;ctx.fillText(txt,x,y);}

function draw(){
  if(!css)readCss();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var g=ctx.createRadialGradient(W*.5,H*.38,0,W*.5,H*.38,Math.max(W,H)*.85);g.addColorStop(0,css['--sea1']);g.addColorStop(1,css['--sea2']);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.lineWidth=1;ctx.strokeStyle=css['--grat'];
  var step=v.k>14?5:10,lo=v.lon-W/2/v.k,hi=v.lon+W/2/v.k;
  for(var a=Math.ceil(lo/step)*step;a<=hi;a+=step){var x=Math.round(X(a))+.5;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  var la0=myInv(v.my+H/2/v.k),la1=myInv(v.my-H/2/v.k);
  for(var b2=Math.ceil(la1/step)*step;b2<=la0;b2+=step){var y=Math.round(Y(b2))+.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.fillStyle=css['--land'];ctx.strokeStyle=css['--landline'];ctx.lineWidth=1;ctx.lineJoin='round';
  ctx.beginPath();LANDP.forEach(function(r){r.forEach(function(q,i){var x=W/2+(q[0]-v.lon)*v.k,y=H/2-(q[2]-v.my)*v.k;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();});
  ctx.fill();ctx.lineWidth=1.3;ctx.stroke();

  ctx.strokeStyle=hexA(css['--hot'],.4);ctx.lineWidth=1.5;ctx.setLineDash([2,7]);ctx.lineCap='round';poly(ROUTE);ctx.stroke();ctx.setLineDash([]);
  var sx=X(SM.lon),sy=Y(SM.lat),fx=X(FIN.lon),fy=Y(FIN.lat);
  ctx.strokeStyle=css['--hot'];ctx.lineWidth=2;ctx.beginPath();ctx.arc(fx,fy,8,0,6.3);ctx.stroke();ctx.beginPath();ctx.arc(fx,fy,3,0,6.3);ctx.fillStyle=css['--hot'];ctx.fill();
  ctx.beginPath();ctx.arc(sx,sy,4,0,6.3);ctx.lineWidth=1.5;ctx.stroke();
  label('FINISH',fx+13,fy+4,13,css['--hot']);label('START',sx+10,sy+4,12,css['--mute']);

  var hasSel=!!sel;
  if(trails){boats.forEach(function(b){
    if(!vis(b)||b.trail.length<2)return;var on=hasSel&&sel.id===b.id,c=colB(b),n=b.trail.length,ch=Math.max(2,Math.ceil(n/10)),base=hasSel&&!on?.3:1;
    ctx.lineCap='round';
    for(var s=0;s<n-1;s+=ch){
      var e=Math.min(n-1,s+ch),f=e/(n-1);
      ctx.strokeStyle=hexA(c,Math.pow(f,1.6)*(on?.95:.7)*base);ctx.lineWidth=(on?1.6:1)+f*(on?2:1.2);
      ctx.beginPath();for(var j=s;j<=e;j++){var p=b.trail[j],px=X(p.lon),py=Y(p.lat);j===s?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.stroke();
    }
  });}

  var vl=boats.filter(vis),all=v.k>13,zf=Math.max(.85,Math.min(2.3,v.k/8));
  vl.forEach(function(b,i){
    var x=X(b.lon),y=Y(b.lat);if(x<-60||y<-60||x>W+60||y>H+60)return;
    var on=hasSel&&sel.id===b.id,c=colB(b),a=(b.cog==null?0:b.cog)*D2R,dx=Math.sin(a),dy=-Math.cos(a),dim=hasSel&&!on;
    var bt=BOATP[b.cls]||BOATP.IMO,len=bt.len*zf*(on?1.3:1),sc=len/100,sp=Math.min(1,(b.sog||0)/30);
    ctx.globalAlpha=dim?.4:1;
    var wl=len*(.9+sp*1.8),sx=x-dx*len*.5,sy=y-dy*len*.5,nx=-dy,ny=dx;
    [-1,1].forEach(function(sd){var ex=sx-dx*wl+nx*sd*wl*.3,ey=sy-dy*wl+ny*sd*wl*.3,gr=ctx.createLinearGradient(sx,sy,ex,ey);gr.addColorStop(0,hexA(css['--ink'],.5));gr.addColorStop(1,hexA(css['--ink'],0));ctx.strokeStyle=gr;ctx.lineWidth=1.3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();});
    if(on){ctx.setLineDash([3,6]);ctx.strokeStyle=css['--sel'];ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx*(len*.5+60),y+dy*(len*.5+60));ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(x,y,len*.62+4,0,6.3);ctx.stroke();}
    ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(sc,sc);ctx.shadowColor=c;ctx.shadowBlur=on?18:9;
    bt.parts.forEach(function(q){var t=q[0],P=q[2];
      if(t==='beam'||t==='foil'){ctx.strokeStyle=c;ctx.lineWidth=Math.max(t==='beam'?2.2:2.8,1.1/sc);ctx.lineCap='round';ctx.stroke(P);}
      else if(t==='hull'){ctx.fillStyle=c;ctx.fill(P);ctx.lineWidth=Math.max(1,.9/sc);ctx.strokeStyle=css['--sea2'];ctx.stroke(P);}
      else if(t==='hi'){ctx.fillStyle='rgba(255,255,255,.32)';ctx.fill(P);}
      else{ctx.strokeStyle='rgba(255,255,255,.96)';ctx.lineWidth=Math.max(2.4,1.2/sc);ctx.lineCap='round';ctx.stroke(P);}
    });
    ctx.restore();ctx.globalAlpha=dim?.5:1;
    var bw=on?19:Math.min(17,11+zf*2),bx=x+len*.38+3,by=y-len*.38-bw*1.17;drawBl(b,bx,by,bw);ctx.globalAlpha=1;
    if(on||(!hasSel&&(i<3||all)))label(b.name,bx+bw+4,by+bw*.85,on?15:12,css['--ink']);
  });
  ctx.textAlign='left';
}

var ptrs={},moved=0,t0=0;
function zoomAt(px,py,f){var lon=v.lon+(px-W/2)/v.k,m=v.my-(py-H/2)/v.k;v.k=Math.max(3,Math.min(80,v.k*f));v.lon=lon-(px-W/2)/v.k;v.my=m+(py-H/2)/v.k;}
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};moved=0;t0=Date.now();});
cv.addEventListener('pointermove',function(e){
  var p=ptrs[e.pointerId];if(!p)return;var ids=Object.keys(ptrs);
  if(ids.length===1){var dx=e.clientX-p.x,dy=e.clientY-p.y;moved+=Math.abs(dx)+Math.abs(dy);v.lon-=dx/v.k;v.my+=dy/v.k;}
  else if(ids.length===2){var o=ids.filter(function(i){return +i!==e.pointerId;})[0],q=ptrs[o];var nd=Math.hypot(e.clientX-q.x,e.clientY-q.y),od=Math.hypot(p.x-q.x,p.y-q.y);moved+=9;if(od>0){var r=cv.getBoundingClientRect();zoomAt((e.clientX+q.x)/2-r.left,(e.clientY+q.y)/2-r.top,nd/od);}}
  p.x=e.clientX;p.y=e.clientY;draw();
});
cv.addEventListener('pointerup',function(e){var had=ptrs[e.pointerId];delete ptrs[e.pointerId];if(had&&moved<8&&Date.now()-t0<450&&!Object.keys(ptrs).length){var r=cv.getBoundingClientRect();pick(e.clientX-r.left,e.clientY-r.top);}});
cv.addEventListener('pointercancel',function(e){delete ptrs[e.pointerId];});
cv.addEventListener('wheel',function(e){e.preventDefault();var r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0015));draw();},{passive:false});

function pick(px,py){var best=null,bd=30;boats.forEach(function(b){if(!vis(b))return;var d=Math.hypot(X(b.lon)-px,Y(b.lat)-py);if(d<bd){bd=d;best=b;}});if(best)select(best,false);else if(sel)select(null);}
function select(b,center){sel=b?{id:b.id}:null;listOpen=false;if(b&&center!==false){v.k=Math.max(v.k,11);v.lon=b.lon;v.my=my(b.lat)-110/v.k;}renderDock();draw();}
function fit(){
  var l=boats.filter(vis);if(!l.length)return;
  var a=[FIN.lat,48.7,FIN.lon,-2];l.forEach(function(b){a[0]=Math.min(a[0],b.lat);a[1]=Math.max(a[1],b.lat);a[2]=Math.min(a[2],b.lon);a[3]=Math.max(a[3],b.lon);});
  var top=170,bot=250,hv=Math.max(120,H-top-bot),mc=(my(a[0])+my(a[1]))/2;
  var kx=(W-48)/(a[3]-a[2]||1),ky=hv/(my(a[1])-my(a[0])||1);
  v.k=Math.max(3,Math.min(60,Math.min(kx,ky)));v.lon=(a[2]+a[3])/2;v.my=mc-(bot-top)/2/v.k;draw();
}

function f1(n){return n==null||isNaN(n)?'--':n.toFixed(1);}
function f0(n){return n==null||isNaN(n)?'--':Math.round(n).toLocaleString('en-US');}
function clsName(k){var c=CLASSES.filter(function(x){return x.k===k})[0];return c?c.n:'Other';}
var bodyEl=document.getElementById('body');
function gapOf(b,lead,i){return i===0?'Leader':'+'+f0(b.dtf-lead.dtf)+' nm';}

function renderDock(){
  var sc=bodyEl.querySelector('.cards'),list=bodyEl.querySelector('.list'),sl=sc?sc.scrollLeft:0,st=list?list.scrollTop:0;
  var b=sel&&boats.filter(function(x){return x.id===sel.id;})[0],h='';
  if(b){
    var c=colB(b);
    h='<div class="pad"><div class="dtl-h" style="--c:'+c+'">'+blSvg(b,32)+'<h3>'+b.name+'</h3><button class="x" id="xs" aria-label="Close">×</button></div>'+
    '<p class="sub">P'+b.rank+' overall · P'+b.crank+' '+clsName(b.cls)+(b.d24!=null?' · '+f0(b.d24)+' nm in 24 h':'')+'</p>'+
    '<div class="hero" style="--c:'+c+'"><div class="speed"><b>'+f1(b.sog)+'</b><span>KN</span></div></div>'+
    '<div class="stats">'+stat('Distance',f0(b.dtf),'nm')+stat('VMG',f1(b.sog),'kn')+'</div></div>';
  }else if(listOpen){
    var vl2=boats.filter(vis);
    h='<div class="pad dhd"><h2>All racers · '+vl2.length+'</h2><button class="link" id="bAll">Close</button></div><div class="pad list" style="max-height:52vh">';
    vl2.forEach(function(x,i){h+='<button class="row" data-id="'+x.id+'" style="--c:'+colB(x)+'"><span class="p">'+pad(i+1)+'</span>'+blSvg(x,22)+'<span class="n">'+x.name+'<small>'+gapOf(x,vl2[0],i)+'</small></span><span class="g">'+f0(x.dtf)+' nm</span><span class="s">'+f1(x.sog)+'<u>kn</u></span></button>';});
    h+='</div>';
  }else{
    var vl3=boats.filter(vis).slice(0,12);
    h='<div class="pad dhd"><h2>Race order</h2><button class="link" id="bAll">View all</button></div><div class="pad cards">';
    vl3.forEach(function(x,i){h+='<button class="card" data-id="'+x.id+'" style="--c:'+colB(x)+'"><span class="pos">'+pad(i+1)+'</span>'+blSvg(x,24)+'<span class="cn">'+x.name+'</span><span class="cg">'+gapOf(x,vl3[0],i)+'</span><span class="cs">'+f1(x.sog)+'<u>kn</u></span></button>';});
    h+='</div>';
  }
  bodyEl.innerHTML=h;
  var sc2=bodyEl.querySelector('.cards'),l2=bodyEl.querySelector('.list');if(sc2)sc2.scrollLeft=sl;if(l2)l2.scrollTop=st;
}
function stat(l,v,u){return '<div class="stat"><label>'+l+'</label><b>'+v+'<u>'+u+'</u></b></div>';}
bodyEl.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.id==='xs'){select(null);return;}
  if(t.id==='bAll'){listOpen=!listOpen;renderDock();return;}
  if(t.dataset.id){var b=boats.filter(function(x){return x.id===t.dataset.id;})[0];if(b)select(b,true);}
});

var fEl=document.getElementById('filters');
function buildFilters(){
  var all=[{k:'ALL',s:'All',v:null}].concat(CLASSES);
  fEl.innerHTML=all.map(function(c){return '<button class="chip glass" data-k="'+c.k+'" aria-pressed="'+(filter===c.k)+'" style="'+(c.v?'--c:var('+c.v+')':'')+'">'+(c.v?'<i></i>':'')+c.s+'</button>';}).join('');
}
fEl.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;filter=b.dataset.k;if(sel){var s=boats.filter(function(x){return x.id===sel.id;})[0];if(s&&!vis(s))sel=null;}buildFilters();renderDock();draw();});
document.getElementById('bTrail').onclick=function(){trails=!trails;this.setAttribute('aria-pressed',trails);draw();};
document.getElementById('bFit').onclick=fit;

var modal=document.getElementById('modal'),msg=document.getElementById('msg');
document.getElementById('bData').onclick=function(){modal.hidden=false;};
document.getElementById('bClose').onclick=function(){modal.hidden=true;};

var DEFAULT_LIVE_URL='https://route-du-rhum-live.andamarco.workers.dev/live.json';
var feedUrl=localStorage.getItem('rdr_live_url')||DEFAULT_LIVE_URL;
document.getElementById('feedUrl').value=feedUrl;

function loadCloudflareFeed(){
  fetch(feedUrl+'?v='+Date.now())
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(raw){
      var rep=raw?.reports;
      if(!rep||!rep.history||!rep.history[0])throw new Error('Invalid feed structure');
      var h=rep.history[0];
      var cols=rep.columns;
      var ix=function(k){return cols.indexOf(k);};
      var date=Date.parse(h.date)/1000;
      
      var r5=function(v){return Math.round(v*1e5)/1e5;};
      var r1=function(v){return Math.round(v*10)/10;};
      
      if(h.lines){
        h.lines.forEach(function(line){
          var id=String(line[ix('boat')]);
          var track=(line[ix('track')]||[])
            .filter(function(p){return Array.isArray(p)&&p.length>=3;})
            .map(function(p){return [p[0],r5(p[1]),r5(p[2]),r1(p[3]??0)];});
          
          if(!hist.tracks[id])hist.tracks[id]=[];
          var m=new Map(hist.tracks[id].map(function(p){return [p[0],p];}));
          for(var i=0;i<track.length;i++){m.set(track[i][0],track[i]);}
          hist.tracks[id]=[...m.values()].sort(function(x,y){return x[0]-y[0];});
          
          var rank=line[ix('rank')];
          if(rank){
            if(!hist.ranks[id])hist.ranks[id]=[];
            hist.ranks[id].push([date,rank,r1(line[ix('dtl')]??0)]);
          }
        });
      }
      hist.updated=Math.max(hist.updated||0,date);
      compute();
      draw();
      renderDock();
      msg.textContent='Feed updated successfully.';
    })
    .catch(function(err){
      msg.textContent='Error loading feed: '+err.message;
    });
}

document.getElementById('bFeed').onclick=function(){
  var u=document.getElementById('feedUrl').value.trim();
  if(!u)return;
  feedUrl=u;
  localStorage.setItem('rdr_live_url',u);
  loadCloudflareFeed();
};
document.getElementById('bReset').onclick=function(){
  feedUrl=DEFAULT_LIVE_URL;
  localStorage.removeItem('rdr_live_url');
  document.getElementById('feedUrl').value=DEFAULT_LIVE_URL;
  loadCloudflareFeed();
};

buildFilters();
resize();
loadCloudflareFeed();
setInterval(loadCloudflareFeed,300000);

window.addEventListener('resize',resize);
})();
</script>
</body></html>
