name: test
on:
  pull_request:
    paths: ['rhum/**', '.github/workflows/**', '.github/scripts/**']
  push:
    branches: [main]
    paths: ['rhum/**', '.github/workflows/**', '.github/scripts/**']
jobs:
  rhum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test rhum/tests/*.test.js
      - run: python3 .github/scripts/test_append_history.py
